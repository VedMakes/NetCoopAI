<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">NetCoop bounded agent orchestration and evidence harness</title>
  <desc id="desc">Specialist results feed a deterministic supervisor proposal and independent evidence gate. For competing hypotheses, the supervisor reviews support and counterevidence, identifies a missing signal, and selects a distinguishing measurement. A retryable gate issue may trigger one targeted task or a correction from existing evidence. The task harness enforces capability, scope, time, schema, provenance, evidence novelty, and hard budgets. The gate checks again and either releases the report or the system abstains.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15111f"/><stop offset="1" stop-color="#1b2630"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#614285"/><stop offset="1" stop-color="#3c2c56"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#08060d" flood-opacity=".3"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c19ee9"/></marker>
    <marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#73d0b3"/></marker>
    <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#df8299"/></marker>
    <style>
      .title{font:700 29px Inter,Segoe UI,Arial,sans-serif;fill:#fbf7ff}.sub{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#c1b6d1}
      .head{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.body{font:12px Inter,Segoe UI,Arial,sans-serif;fill:#ded6e8}.small{font:11px Inter,Segoe UI,Arial,sans-serif;fill:#bfb3ce}.tiny{font:10px Inter,Segoe UI,Arial,sans-serif;fill:#b4a8c0}
      .card{fill:#29213a;stroke:#66547d;stroke-width:1.3}.line{fill:none;stroke:#c19ee9;stroke-width:2;marker-end:url(#arr)}
    </style>
  </defs>
  <rect width="1500" height="900" rx="26" fill="url(#bg)"/>
  <circle cx="1430" cy="60" r="190" fill="#9f67ca" opacity=".07"/><circle cx="40" cy="840" r="200" fill="#52c7a7" opacity=".05"/>
  <text x="48" y="55" class="title">Agentic, with a harness—not a free-running loop</text>
  <text x="48" y="83" class="sub">Each turn has an authorized purpose, typed output, evidence checks and a stop condition.</text>

  <!-- initial diagnosis path -->
  <g filter="url(#shadow)">
    <rect x="52" y="125" width="245" height="119" rx="18" fill="#233446" stroke="#6284a0"/>
    <text x="76" y="160" class="head">1 · Specialist pass</text><text x="76" y="187" class="body">Four towers analyze the</text><text x="76" y="208" class="body">normalized incident evidence.</text><text x="76" y="230" class="tiny">Findings + hypotheses</text>

    <rect x="351" y="125" width="265" height="119" rx="18" fill="url(#purple)" stroke="#a988cb"/>
    <text x="375" y="160" class="head">2 · Supervisor proposal</text><text x="375" y="187" class="body">Correlates support, conflicts,</text><text x="375" y="208" class="body">gaps and task value.</text><text x="375" y="230" class="tiny">Deterministic control plane</text>

    <path d="M297 184h47" class="line"/><path d="M616 184h48" class="line"/>
    <rect x="676" y="125" width="265" height="119" rx="18" fill="#214c49" stroke="#61ad98"/>
    <text x="700" y="160" class="head">3 · Independent gate</text><text x="700" y="187" class="body">Checks support, citation IDs,</text><text x="700" y="208" class="body">scope, freshness and conflicts.</text><text x="700" y="230" class="tiny">Gate owns publication decision</text>

    <path d="M941 184h46" fill="none" stroke="#73d0b3" stroke-width="2" marker-end="url(#arr-green)"/>
    <rect x="999" y="125" width="205" height="119" rx="18" fill="#1f5149" stroke="#65b89f"/>
    <text x="1022" y="160" class="head">PASS → publish</text><text x="1022" y="188" class="body">Evidence-backed diagnosis</text><text x="1022" y="209" class="body">and report.</text>

    <rect x="1252" y="125" width="202" height="119" rx="18" fill="#352740" stroke="#916d9c"/>
    <text x="1273" y="160" class="head">Explain live</text><text x="1273" y="188" class="body">`--explain` streams the</text><text x="1273" y="209" class="body">handoffs and gate checks.</text>
  </g>

  <!-- gate rejection branch -->
  <path d="M808 244v58H585v46" fill="none" stroke="#df8299" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="512" y="354" width="460" height="74" rx="16" fill="#452834" stroke="#ca718a" stroke-width="1.4"/>
  <text x="742" y="382" text-anchor="middle" class="head">Gate rejects · structured issue code</text>
  <text x="742" y="407" text-anchor="middle" class="body">Retry only if the gap is actionable; otherwise abstain.</text>

  <path d="M742 428v20H256v23" class="line"/>
  <g filter="url(#shadow)">
    <rect x="84" y="480" width="345" height="198" rx="20" fill="#27213a" stroke="#80649d"/>
    <text x="110" y="516" class="head">Supervisor conflict / gap review</text>
    <rect x="108" y="528" width="296" height="34" rx="10" fill="#352a49"/><text x="126" y="550" class="body">Review both competing hypotheses</text>
    <rect x="108" y="568" width="296" height="34" rx="10" fill="#352a49"/><text x="126" y="590" class="body">Compare support ↔ counterevidence</text>
    <rect x="108" y="608" width="296" height="34" rx="10" fill="#352a49"/><text x="126" y="630" class="body">Name gap + distinguishing measurement</text>
    <text x="110" y="665" class="tiny">New task · repair known refs · ask or abstain</text>

    <rect x="494" y="480" width="505" height="198" rx="20" fill="#24263b" stroke="#6f77a0" stroke-width="1.4"/>
    <text x="520" y="516" class="head">Typed specialist task harness</text>
    <text x="520" y="545" class="body">1 · Capability allowlist + incident scope</text>
    <text x="520" y="571" class="body">2 · Read-only objective + bounded evidence window</text>
    <text x="520" y="597" class="body">3 · Timeout + legal task-state transitions</text>
    <text x="520" y="623" class="body">4 · Schema, evidence IDs, timestamps and sources checked</text>
    <text x="520" y="650" class="small">Structured review: support · counterevidence · missing signal · distinguishing test</text>

    <rect x="1064" y="480" width="355" height="198" rx="20" fill="#243a3b" stroke="#5b9c8f" stroke-width="1.4"/>
    <text x="1090" y="516" class="head">Bounded re-evaluation</text>
    <text x="1090" y="547" class="body">Novel evidence is merged only after</text><text x="1090" y="569" class="body">provenance and reference validation.</text>
    <text x="1090" y="603" class="body">Supervisor revises or retains proposal.</text>
    <text x="1090" y="641" class="small">Gate checks again, independently.</text>
  </g>

  <path d="M429 494h57" class="line"/><path d="M999 494h58" class="line"/>
  <path d="M1240 480v-25h225V310H900v-66" fill="none" stroke="#c19ee9" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1200" y="442" text-anchor="middle" class="tiny">revised proposal → one gate retry</text>

  <!-- explicit stop rule and limits -->
  <rect x="84" y="725" width="1335" height="117" rx="20" fill="#201a2d" stroke="#645276" stroke-width="1.3"/>
  <text x="112" y="762" class="head">Hard stop rules keep the investigation legible</text>
  <rect x="112" y="785" width="204" height="42" rx="12" fill="#322844"/><text x="214" y="812" text-anchor="middle" class="body">≤ 4 supervisor calls</text>
  <rect x="329" y="785" width="204" height="42" rx="12" fill="#322844"/><text x="431" y="812" text-anchor="middle" class="body">≤ 2 investigation rounds</text>
  <rect x="546" y="785" width="174" height="42" rx="12" fill="#322844"/><text x="633" y="812" text-anchor="middle" class="body">≤ 6 tasks</text>
  <rect x="733" y="785" width="226" height="42" rx="12" fill="#322844"/><text x="846" y="812" text-anchor="middle" class="body">≤ 2 peer checks per task</text>
  <rect x="972" y="785" width="173" height="42" rx="12" fill="#322844"/><text x="1058" y="812" text-anchor="middle" class="body">≤ 1 gate retry</text>
  <rect x="1158" y="785" width="231" height="42" rx="12" fill="#452834" stroke="#a65c72"/><text x="1273" y="812" text-anchor="middle" class="body">Still weak? Abstain.</text>
  <text x="54" y="875" class="tiny">Limits are runtime defaults. Specialist reviews are read-only analysis of supplied telemetry; they are not live network probes.</text>
</svg>
