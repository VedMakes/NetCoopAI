<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">How NetCoop keeps model use focused</title>
  <desc id="desc">All telemetry is analyzed by deterministic specialist rules. Only if the deterministic supervisor reaches a supported diagnosis and optional LLM mode is configured does a compact structured context go to the model, which can refine read-only recommendations but cannot change the diagnosis. The evidence gate verifies the report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171323"/><stop offset="1" stop-color="#211832"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b6ad7"/><stop offset="1" stop-color="#7043a2"/></linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bc9ae4"/></marker>
    <style>
      .head{font:700 23px Inter,Segoe UI,Arial,sans-serif;fill:#f5efff}.title{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.body{font:12px Inter,Segoe UI,Arial,sans-serif;fill:#d1c7df}.note{font:11px Inter,Segoe UI,Arial,sans-serif;fill:#b7abc8}
    </style>
  </defs>
  <rect width="1200" height="390" rx="24" fill="url(#bg)"/>
  <circle cx="1100" cy="42" r="150" fill="#a467cf" opacity=".08"/>
  <text x="42" y="53" class="head">Spend model calls where they can add value</text>
  <text x="42" y="78" class="note">Specialist depth comes from domain-focused analysis—not four general-purpose agents debating the same raw capture.</text>
  <g>
    <rect x="42" y="126" width="234" height="142" rx="18" fill="#29213a" stroke="#57466d"/>
    <circle cx="73" cy="162" r="16" fill="#375d73"/><path d="M65 162h16m-8-8v16" stroke="#e0f5ff" stroke-width="2" stroke-linecap="round"/>
    <text x="100" y="167" class="title">Full capture</text><text x="64" y="204" class="body">Raw observations + topology</text><text x="64" y="225" class="body">stay in the local analysis flow</text><text x="64" y="250" class="note">No model call required</text>

    <rect x="327" y="112" width="295" height="170" rx="20" fill="#242039" stroke="#765c93" stroke-width="1.4"/>
    <text x="351" y="147" class="title">Deterministic specialists</text><text x="351" y="172" class="body">Four domain-specific analyzers inspect evidence,</text><text x="351" y="192" class="body">then a deterministic supervisor checks support.</text>
    <rect x="351" y="216" width="241" height="40" rx="11" fill="#34264a"/><text x="371" y="241" class="body">Filter · correlate · abstain</text>

    <rect x="675" y="112" width="252" height="170" rx="20" fill="url(#accent)" stroke="#c2a0eb" stroke-width="1.4"/>
    <text x="700" y="147" class="title">Optional model assist</text><text x="700" y="173" class="body">Only a compact, structured context is sent</text><text x="700" y="194" class="body">when a supported diagnosis exists.</text>
    <rect x="700" y="216" width="201" height="40" rx="11" fill="#432b60" stroke="#ba91e2"/><text x="718" y="241" class="body">Refine safe next steps</text>

    <rect x="981" y="126" width="177" height="142" rx="18" fill="#20554f" stroke="#62aa99"/>
    <path d="m1008 164 9 9 20-23" fill="none" stroke="#e1fff4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1047" y="168" class="title">Gate + report</text><text x="1003" y="204" class="body">Evidence checked</text><text x="1003" y="225" class="body">Diagnosis stays fixed</text><text x="1003" y="249" class="note">Abstain if unsupported</text>
  </g>
  <path d="M276 196h43" fill="none" stroke="#bc9ae4" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M622 196h43" fill="none" stroke="#bc9ae4" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M927 196h43" fill="none" stroke="#bc9ae4" stroke-width="2" marker-end="url(#arr)"/>
  <text x="42" y="326" class="note">Why this helps: cheap, repeatable checks handle the broad pass; bounded orchestration calls targeted follow-ups; model context is reserved for constrained assistance.</text>
  <text x="42" y="350" class="note">This is a token-conscious design, not a published token-savings benchmark. Actual spend depends on capture size, model choice, and which optional paths run.</text>
</svg>
