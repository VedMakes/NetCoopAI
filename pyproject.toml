[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netcoop"
version = "0.1.0"
description = "NetCoop AI: Multi-Agent Network Fault Diagnosis and Interoperability"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "networkx>=3.2",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
netcoop = "netcoop.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/netcoop"]

[tool.hatch.build.targets.editable]
sources = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "reference",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]


