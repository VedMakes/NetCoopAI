<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NetCoop specialist tower architecture</title>
  <desc id="desc">Telemetry is normalized, analyzed by four focused deterministic specialist towers, coordinated by a supervisor, checked by an independent evidence gate, and published as an evidence-backed report. A typed integration fabric enables bounded peer checks and specialist tasks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171323"/><stop offset="1" stop-color="#211832"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b6ad7"/><stop offset="1" stop-color="#7043a2"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#246b66"/><stop offset="1" stop-color="#194b50"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#08060d" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b998e6"/></marker>
    <style>
      .title{font:700 27px Inter,Segoe UI,Arial,sans-serif;fill:#f5efff}.sub{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#c0b5d1}
      .h{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#faf7ff}.body{font:12px Inter,Segoe UI,Arial,sans-serif;fill:#d0c6dc}.small{font:11px Inter,Segoe UI,Arial,sans-serif;fill:#b7abc8}
      .card{fill:#29213a;stroke:#55446d;stroke-width:1.2}.line{fill:none;stroke:#b998e6;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="630" rx="24" fill="url(#bg)"/>
  <circle cx="1110" cy="80" r="155" fill="#9c66c8" opacity=".07"/><circle cx="60" cy="570" r="190" fill="#53c8b3" opacity=".05"/>
  <text x="48" y="58" class="title">A focused team of network specialists</text>
  <text x="48" y="86" class="sub">Focused domain analysis, bounded cooperation, deterministic control, independent evidence checks.</text>

  <g filter="url(#shadow)">
    <rect x="42" y="220" width="150" height="140" rx="18" class="card"/>
    <rect x="60" y="241" width="36" height="36" rx="11" fill="#385f78"/><path d="M70 258h16m-8-8v16" stroke="#d8f1ff" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="306" class="h">Capture</text><text x="60" y="329" class="body">Telemetry + optional</text><text x="60" y="346" class="body">topology map</text>

    <rect x="228" y="220" width="155" height="140" rx="18" class="card"/>
    <rect x="247" y="241" width="36" height="36" rx="11" fill="#386c61"/><path d="M256 252h18m-18 7h18m-18 7h12" stroke="#d7fff0" stroke-width="2" stroke-linecap="round"/>
    <text x="247" y="306" class="h">Normalize</text><text x="247" y="329" class="body">Map fields, validate</text><text x="247" y="346" class="body">units, flag data gaps</text>

    <rect x="432" y="139" width="286" height="302" rx="22" fill="#211a30" stroke="#6c5787" stroke-width="1.4"/>
    <text x="455" y="173" class="h">Four focused towers</text><text x="455" y="195" class="small">Each tower analyzes its own domain</text>
    <rect x="453" y="215" width="244" height="43" rx="12" fill="#253b4b" stroke="#42677d"/><circle cx="475" cy="236" r="7" fill="#66c5e4"/><text x="493" y="241" class="body">Performance</text><text x="677" y="241" text-anchor="end" class="small">traffic · Wi-Fi</text>
    <rect x="453" y="269" width="244" height="43" rx="12" fill="#3d2d4e" stroke="#765792"/><circle cx="475" cy="290" r="7" fill="#c39ae9"/><text x="493" y="295" class="body">Infrastructure</text><text x="677" y="295" text-anchor="end" class="small">health · interfaces</text>
    <rect x="453" y="323" width="244" height="43" rx="12" fill="#233f3e" stroke="#41776e"/><circle cx="475" cy="344" r="7" fill="#6bd1ae"/><text x="493" y="349" class="body">Connectivity</text><text x="677" y="349" text-anchor="end" class="small">paths · impact</text>
    <rect x="453" y="377" width="244" height="43" rx="12" fill="#4a3c27" stroke="#897044"/><circle cx="475" cy="398" r="7" fill="#e9c274"/><text x="493" y="403" class="body">Services</text><text x="677" y="403" text-anchor="end" class="small">DNS · DHCP · health</text>

    <rect x="460" y="477" width="272" height="83" rx="17" fill="#27203a" stroke="#80679f" stroke-dasharray="6 5"/>
    <text x="482" y="507" class="h">Typed integration fabric</text><text x="482" y="530" class="body">Read-only peer checks · scoped tasks · auditable handoffs</text>

    <rect x="796" y="220" width="160" height="140" rx="18" fill="url(#violet)" stroke="#bd99e9"/>
    <path d="M824 255h32m-16-16v32m28-22 11 6-11 6" stroke="#f7eaff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="817" y="306" class="h">Supervisor</text><text x="817" y="329" class="body">Compares hypotheses,</text><text x="817" y="346" class="body">chooses bounded work</text>

    <rect x="1002" y="220" width="156" height="140" rx="18" fill="url(#mint)" stroke="#5fa99a"/>
    <path d="m1024 260 10 10 22-25" fill="none" stroke="#d7fff2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1024 278h38" stroke="#b1e8d9" stroke-width="2"/>
    <text x="1023" y="306" class="h">Evidence gate</text><text x="1023" y="329" class="body">Verifies references,</text><text x="1023" y="346" class="body">scope and provenance</text>
  </g>

  <path d="M192 290h31" class="line"/><path d="M383 290h41" class="line"/>
  <path d="M718 290h68" class="line"/><path d="M956 290h39" class="line"/>
  <path d="M574 441v30" class="line"/><path d="M732 518h32q20 0 20-20V395q0-20 20-20" class="line"/>
  <path d="M1080 360v74q0 20-20 20H902" fill="none" stroke="#6bd1ae" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="776" y="430" width="265" height="80" rx="15" fill="#201a2d" stroke="#57466d"/>
  <text x="796" y="459" class="h">Published report</text><text x="796" y="481" class="body">Cause · evidence · confidence · impact</text><text x="796" y="498" class="small">or a clear abstention when support is weak</text>
  <text x="48" y="600" class="small">Optional LLM assistance is downstream of deterministic checks: it can refine bounded read-only recommendations, not choose the diagnosis.</text>
</svg>
